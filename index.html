<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机场室内导航 - 路线清晰版</title>
    <script src="https://webapi.amap.com/maps?v=2.0&key=37998adb2d5488949647812aebeaf528"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        html,body {width:100%;height:100%}
        #map {width:100%;height:calc(100% - 80px);}
        .panel {position:fixed;bottom:0;left:0;right:0;height:80px;background:#fff;display:flex;align-items:center;justify:center;gap:10px;padding:0 15px}
        button {padding:10px 14px;border-radius:8px;border:none;background:#005792;color:white;font-size:14px}

        /* 路线超级明显 */
        .route-line {
            stroke: #ff6a00 !important;
            stroke-width: 12px !important;
            stroke-opacity: 1 !important;
            stroke-linecap: round !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <button onclick="goCheckin()">值机柜台</button>
        <button onclick="goSecurity()">安检区</button>
        <button onclick="goGate()">登机口A12</button>
        <button onclick="clearAll()">清空</button>
    </div>

<script>
let map;
let startMarker, endMarker;
let routeLine;

// 首都机场T3 室内精准坐标
const points = {
  checkin:   [116.6105, 40.0801],   // 值机
  security:  [116.6110, 40.0798],   // 安检
  gate:      [116.6120, 40.0790],   // 登机口
};

// 初始化地图（室内细节全开）
function initMap() {
  map = new AMap.Map("map", {
    zoom: 20,                // 最大室内级别
    center: points.checkin,
    viewMode: '3D',
    resizeEnable: true,
    features: ['bg', 'road', 'building', 'point'], // 室内细节拉满
  });
}

// 画超粗、超清晰路线
function drawRoute(from, to, name1, name2) {
  clearAll();

  // 起点标记
  startMarker = new AMap.Marker({
    position: from,
    content: `<div style="background:#ff6a00;color:white;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px">🟠</div>`,
    offset: [-20, -40],
  });
  startMarker.setMap(map);

  // 终点标记
  endMarker = new AMap.Marker({
    position: to,
    content: `<div style="background:#0078ff;color:white;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px">🔵</div>`,
    offset: [-20, -40],
  });
  endMarker.setMap(map);

  // 路线：超级粗、实线、高亮
  routeLine = new AMap.Polyline({
    path: [from, to],
    strokeColor: "#ff6a00",
    strokeWeight: 12,    // 超粗
    strokeOpacity: 1,
    strokeStyle: "solid",
    zIndex: 999,         // 置顶
    className: "route-line",
  });
  routeLine.setMap(map);

  // 自动视角
  map.setFitView([startMarker, endMarker, routeLine], false, [100, 100]);
}

function goCheckin() {
  drawRoute(points.security, points.checkin, "安检", "值机");
}
function goSecurity() {
  drawRoute(points.checkin, points.security, "值机", "安检");
}
function goGate() {
  drawRoute(points.security, points.gate, "安检", "登机口");
}
function clearAll() {
  if (routeLine) routeLine.remove();
  if (startMarker) startMarker.remove();
  if (endMarker) endMarker.remove();
}

window.onload = initMap;
</script>
</body>
</html>
